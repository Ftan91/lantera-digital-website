hero_heading: About Lantera Digital
hero_body: >-
  We are a data and AI consultancy based in Malaysia, working with
  organisations that want measurable value from their data.

mission_heading: Why the Name Lantera
mission_body: >-
  A lantera is a lantern, a light that shows the way forward. That is how
  we see data and AI: tools that should bring clarity to the people making
  decisions.

approach_heading: Our Approach to Consulting
approach_body: >-
  Every engagement, whether training, platform, or AI, is designed so your
  team understands and owns what we deliver. We focus on doing fewer things
  well, handing them over cleanly, and recommending only the work you need.

principles_heading: What We Value
principles:
  - title: Outcomes Over Output
    body: We measure success by the decisions our work enables for your organisation.
  - title: Regional Context
    body: We understand the data maturity, talent market, and business environment in Malaysia and across the region, because this is where we live and work.
  - title: Vendor Independence
    body: We recommend the platform and approach that best fit your needs, with no commercial ties to any vendor.

founders_heading: Leadership
founders_intro: >-
  Lantera Digital is led by two engineering directors, based in Kuala
  Lumpur and London, with deep experience delivering data and AI work.

founders:
  - name: Finn Tan Wee Lip
    title: Engineering Director & Co-Founder
    linkedin: https://www.linkedin.com/in/finn-tan-wee-lip-4b773084/
    photo: /assets/founders/finn.jpeg
    bio: >-
      Finn is a data engineer from Malaysia, now based in London, with
      years of experience designing and building modern data platforms. He
      holds multiple Databricks certifications, has delivered data
      engineering work at UBDS Group, and speaks regularly at data community
      events. Bilingual in English and Malay, Finn leads Lantera Digital's
      hands on approach to platform delivery.
  - name: Irfan Noordin
    title: Engineering Director & Co-Founder
    linkedin: https://www.linkedin.com/in/irfan-noordin/
    photo: /assets/founders/irfan.jpeg
    bio: >-
      Irfan is a data scientist based in Kuala Lumpur with an engineering
      background from McMaster University. He has worked on digital
      transformation at Sime Darby Plantation and SD Guthrie Berhad,
      previously served as Dean at School of AI Kuala Lumpur teaching
      machine learning, and helps organise the Data Council community in
      Malaysia. Irfan ensures Lantera Digital's AI work is grounded in how
      Malaysian businesses operate.
