hero_heading: About Lantera Digital
hero_body: >-
  We are a data and AI consultancy based in Kuala Lumpur. We help
  organisations organise their data, train their people and build
  practical AI tools.

mission_heading: Why the Name Lantera
mission_body: >-
  A lantera is a lantern. A lantern lights the path ahead so you can see
  where you are going, and that is what good use of data should do for the
  people making decisions in a business.

approach_heading: How We Work With Clients
approach_body: >-
  We design every project so your team understands what we have built and
  can run it without us. We would rather do a smaller piece of work well
  than sell you more than you need.

principles_heading: What We Stand For
principles:
  - title: Results First
    body: We judge our work by whether it helps you make better decisions and run your business more smoothly.
  - title: Local Understanding
    body: We live and work in the region, so we understand the local market, talent and regulations.
  - title: Independent Advice
    body: We have no commercial ties to any software vendor, so we recommend whatever suits you best.

founders_heading: Our Founders
founders_intro: >-
  Lantera Digital was founded by two engineers, one based in Kuala Lumpur
  and one in London, who have spent their careers building data and AI
  systems.

founders:
  - name: Finn Tan Wee Lip
    title: Engineering Director & Co-Founder
    linkedin: https://www.linkedin.com/in/finn-tan-wee-lip-4b773084/
    photo: /assets/founders/finn.jpeg
    bio: >-
      Finn is a data engineer from Malaysia, now based in London. He has
      spent his career designing and building data platforms, holds several
      Databricks certifications, and has worked on data engineering projects
      at UBDS Group. He speaks regularly at data community events and is
      fluent in English and Malay. At Lantera Digital he focuses on our
      data platform work.
  - name: Irfan Noordin
    title: Engineering Director & Co-Founder
    linkedin: https://www.linkedin.com/in/irfan-noordin/
    photo: /assets/founders/irfan.jpeg
    bio: >-
      Irfan is a data scientist based in Kuala Lumpur with an engineering
      background from McMaster University. He has worked on digital
      transformation at Sime Darby Plantation and SD Guthrie Berhad, and was
      previously Dean at School of AI Kuala Lumpur, where he taught machine
      learning. He also helps run the Data Council community in Malaysia. At
      Lantera Digital he focuses on making sure our AI work fits how
      Malaysian businesses operate.
