hero_heading: Technology We Work With
hero_body: >-
  We are not tied to any software vendor. We choose the tools that suit
  each client, and these are the ones we use most often.

stack:
  - name: Databricks
    logos:
      - /assets/tech/databricks.svg
    blurb: >-
      A platform for storing, processing and analysing large amounts of
      data in one place, and for building AI on top of it. It is our
      preferred choice when a client needs all of this together, and our
      team holds Databricks certifications.
  - name: Microsoft Fabric & Power BI
    logos:
      - /assets/tech/microsoft.svg
      - /assets/tech/powerbi.svg
    blurb: >-
      Microsoft's data platform and its reporting tool. A good fit for
      organisations that already use Microsoft 365, because data and reports
      stay in a familiar environment.
  - name: Anthropic Claude
    logos:
      - /assets/tech/anthropic.svg
    blurb: >-
      A family of AI models made by Anthropic. It is our preferred choice
      for building assistants that read your documents and answer questions
      about them accurately.
  - name: Open Source & Custom Tooling
    icon: custom
    blurb: >-
      Widely used free tools such as Python, dbt and Airflow, which we use
      to build and schedule data processing. We pick them based on what
      each project needs.
