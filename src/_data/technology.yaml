hero_heading: Technology We Work With
hero_body: >-
  We are vendor independent and select the stack that best fits each
  client. These are the platforms we work with most often.

stack:
  - name: Databricks
    logos:
      - /assets/tech/databricks.svg
    blurb: >-
      Our preferred lakehouse platform when data engineering, analytics,
      and AI need to live in one place. We bring certified expertise to
      teams already running on Databricks.
  - name: Microsoft Fabric & Power BI
    logos:
      - /assets/tech/microsoft.svg
      - /assets/tech/powerbi.svg
    blurb: >-
      For organisations invested in the Microsoft ecosystem, we build on
      Fabric and Power BI so reporting and data engineering sit on a
      single, familiar platform.
  - name: Anthropic Claude
    logos:
      - /assets/tech/anthropic.svg
    blurb: >-
      Our preferred model family for AI assistants and agents that need to
      reason carefully over your data and documents.
  - name: Open Source & Custom Tooling
    icon: custom
    blurb: >-
      Python, dbt, Airflow, and other proven tools, selected on merit for
      each engagement.
