- slug: insurance-claims-assistant
  industry: Insurance
  name: Insurance Claims Enquiries
  title: An AI Assistant for Insurance Customer Enquiries
  summary: >-
    A prototype assistant that answers customer questions about their
    policy using the actual policy documents, and passes anything involving
    a claim to a member of staff.
  hero_body: >-
    Insurance customers regularly ask the same two things: what does my
    policy cover, and can I make a claim? Answering correctly means looking
    up the right policy wording and rules each time, which is slow and can
    lead to inconsistent answers across a busy team. We built this
    prototype to see whether AI could safely write the first draft of these
    replies, and hand over to a person when it should.
  problem_heading: The Problem
  problem_body: >-
    Staff answering policy and claims questions have to balance speed with
    accuracy. Answering from memory is quick but risks giving wrong
    information about what is covered. Checking every document takes time
    and keeps customers waiting. Mistakes matter most with claims, where a
    wrong answer can cost the customer or the insurer money.
  solution_heading: What We Built
  solution_body: >-
    The assistant reads the customer's question, finds the relevant
    sections of the policy documents and compliance rules, and drafts a
    reply based only on what it found. The draft is then checked against
    those documents. Anything related to an actual claim, or to an account
    flagged for extra care, goes to a member of staff to approve, edit or
    reject before the customer sees it.
  how_it_works:
    - title: Read the Enquiry
      body: >-
        The assistant reads the whole conversation, so it understands short
        follow ups such as "yes, please go ahead".
    - title: Find the Policy Details
      body: >-
        It searches the policy documents and compliance rules for the parts
        that apply to this question.
    - title: Draft a Reply
      body: >-
        It writes a reply using only what it found. If it finds nothing
        relevant, it says so.
    - title: Check the Draft
      body: >-
        The reply is checked against the source documents. Anything the
        documents do not support is replaced with a safe standard response.
    - title: Staff Review
      body: >-
        Replies about claims, or for flagged accounts, go to a member of
        staff for approval before they are sent.
    - title: Keep a Record
      body: >-
        Once approved, the next step, such as opening a claim, is logged
        along with everything that happened before it.
  safeguards_heading: Safeguards
  safeguards_body: >-
    Our main goal was to make sure the assistant never makes things up. It
    only uses the documents it has been given, and if a question falls
    outside them, it says so. Every reply is checked a second time before
    it is released, and a person reviews every message related to a claim.
    Every step is logged, including anything that was blocked, so the
    process can be audited.
  outcomes:
    - Routine questions about cover answered faster and more consistently
    - Staff stay in control of anything involving a claim
    - A full record of every step, useful for training and audits
    - A low risk way to test what AI can handle in a claims team before
      investing further

- slug: legal-precedent-research
  industry: Legal
  name: Legal Precedent Research
  title: AI Legal Research With Every Citation Checked
  summary: >-
    A prototype that finds relevant past court cases for a contract
    dispute, drafts an argument from them, and checks every case reference
    against official records before a lawyer reviews it.
  hero_body: >-
    Building a legal argument starts with finding past court decisions
    that support your position. This research is slow and repetitive,
    which makes AI appealing. The risk is that general AI tools sometimes
    invent cases that sound real but do not exist, which is a serious
    problem in legal work. We built this prototype to test whether that
    risk can be controlled.
  problem_heading: The Problem
  problem_body: >-
    Finding the right precedents takes time, and the strength of the final
    argument depends on how thorough that research is. General AI tools can
    speed it up, but they can also cite cases that were never decided, or
    misstate what a real case said. In legal work, one bad citation can
    undermine an entire argument.
  solution_heading: What We Built
  solution_body: >-
    We focused on one well defined question: whether a penalty clause in a
    contract can be enforced under the law of England and Wales. The
    prototype takes a description of the situation, identifies the legal
    issue, and searches a small set of real, verified court judgments for
    the relevant cases. It drafts an argument using only those cases.
    Before a lawyer sees the draft, every case it cites is checked against
    the National Archives' official public record of judgments. A lawyer
    reviews and approves every argument.
  how_it_works:
    - title: Identify the Issue
      body: >-
        The system works out what kind of dispute is being described.
    - title: Search Real Cases
      body: >-
        It searches a hand checked set of real judgments for the cases that
        apply to the facts.
    - title: Draft the Argument
      body: >-
        It writes an argument that cites only the cases it found.
    - title: Check Every Citation
      body: >-
        Each cited case is checked against the National Archives' public
        record. Any that cannot be confirmed are flagged.
    - title: Lawyer Review
      body: >-
        A lawyer reviews the draft and the check results, just as they
        would review work from a junior colleague.
  safeguards_heading: Safeguards
  safeguards_body: >-
    Two design choices did most of the work. First, the system can only
    draw on a small set of real judgments taken from the National Archives,
    so there are no invented cases for it to use. Second, every citation in
    a draft is checked again against the official record before a person
    sees it. We also included one judgment that looks relevant but does not
    apply, to confirm the system knows when to leave a case out.
  outcomes:
    - Faster first drafts for a common type of legal research
    - Every citation checked against official records before a lawyer sees it
    - A lawyer makes the final decision on every argument
    - A clear test of where AI is, and is not, appropriate in legal work

- slug: vendor-shortlisting
  industry: Procurement
  name: Supplier Shortlisting
  title: Fair, Traceable Supplier Shortlisting
  summary: >-
    A prototype that scores supplier bids against your requirements,
    compares prices with real public tender data, and automatically rules
    out any bid that misses a mandatory requirement.
  hero_body: >-
    Comparing supplier bids sounds simple until you have several bids, each
    with different strengths and prices, and a deadline. Mandatory
    requirements can slip into being treated as optional, and the best
    written bid can win over the best value one. We built this prototype to
    see whether AI could help produce a fair shortlist that can be
    explained and checked.
  problem_heading: The Problem
  problem_body: >-
    Evaluating bids properly takes time, and the outcome can be swayed by
    whichever bid is most persuasive. Requirements such as a specific
    certification should rule a supplier out if they are missing, but under
    pressure they can end up as just another score. Prices are also hard to
    judge without knowing what similar work costs elsewhere.
  solution_heading: What We Built
  solution_body: >-
    The prototype starts from an evaluation brief that lists what the
    business needs and how important each requirement is. It looks up
    comparable prices from public UK government tender records, scores
    each bid against the requirements, and ranks the suppliers using a
    fixed formula, so every score can be checked line by line. Any supplier
    missing a mandatory requirement is ruled out automatically. A
    procurement manager reviews and approves the shortlist before it is
    final.
  how_it_works:
    - title: Read the Brief
      body: >-
        The system reads the evaluation brief and notes which requirements
        matter most.
    - title: Check Market Prices
      body: >-
        It pulls comparable prices from public UK government tender records.
    - title: Score Each Bid
      body: >-
        Every bid is scored against the requirements in the brief.
    - title: Rank With a Fixed Formula
      body: >-
        Suppliers are ranked by a fixed calculation, so the same inputs
        always give the same result.
    - title: Write the Report
      body: >-
        It produces a shortlist report showing how each supplier scored and
        why.
    - title: Manager Approval
      body: >-
        A procurement manager reviews and signs off the shortlist.
  safeguards_heading: Safeguards
  safeguards_body: >-
    The most important safeguard does not involve AI at all. The mandatory
    requirement check and the final ranking are handled by simple fixed
    rules, so they cannot be argued around. In our tests, the cheapest
    supplier was left off every shortlist because it lacked a required
    certification, however the other requirements were weighted. The parts
    that need judgment, reading the brief and scoring the bids, are
    reviewed and approved by a person.
  outcomes:
    - A consistent evaluation process, whoever runs it
    - Mandatory requirements that are always enforced
    - Prices compared against real market data
    - A shortlist the procurement manager reviews and approves
