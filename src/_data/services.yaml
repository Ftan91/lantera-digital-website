- id: training
  slug: training
  name: Data & AI Training
  summary: >-
    Hands on training that builds lasting data and AI capability across
    your team.
  icon: training
  tone: slate
  hero_heading: Build a Team That Works Confidently With Data and AI
  hero_body: >-
    Practical, instructor led programmes for analysts, engineers, and
    leaders, designed around your own data, tools, and workflows.
  who_its_for: >-
    Organisations that want their people to be genuinely capable with data
    and AI, from teams writing their first SQL queries to engineers
    adopting a new platform.
  offerings:
    - title: Data Fundamentals
      body: SQL, data modelling, and analytical thinking for teams building their foundations.
    - title: AI and LLM Literacy
      body: Practical workshops on using AI tools effectively, safely, and responsibly at work.
    - title: Platform Upskilling
      body: Targeted training on the platforms your team already runs, including Databricks and Microsoft Fabric.
  approach:
    - title: Assess
      body: We establish a clear baseline of your team's current skills and goals.
    - title: Tailor
      body: Course content is built around your own data and workflows for immediate relevance.
    - title: Deliver
      body: Hands on sessions in which every participant builds something real.
  outcomes:
    - A team that works with data confidently and independently
    - Training materials your team keeps and can reuse
    - A clear view of remaining skill gaps and how to close them

- id: data-platform
  slug: data-platform
  name: Data Platform Services
  summary: >-
    Reliable, well governed data platforms, built with your team and
    handed over in full.
  icon: platform
  tone: velvet
  hero_heading: Data Platforms Built for Ownership
  hero_body: >-
    We design and build data platforms, pipelines, warehousing, and
    governance, with your team involved from day one so the platform is
    fully yours at handover.
  who_its_for: >-
    Organisations that need a dependable data foundation, whether
    consolidating spreadsheets and disconnected systems or modernising an
    existing platform.
  offerings:
    - title: Platform Architecture
      body: An architecture sized to your scale, budget, and plans for growth.
    - title: Pipelines and Integration
      body: Reliable pipelines that bring together and shape data from your source systems.
    - title: Governance and Quality
      body: Practical data quality, access control, and governance that keep pace with your team.
  approach:
    - title: Audit
      body: We map your current data landscape and identify where it costs you time or trust.
    - title: Design
      body: An architecture matched precisely to your requirements.
    - title: Build and Hand Over
      body: We build alongside your team and document everything for long term ownership.
  outcomes:
    - A platform your team understands and can maintain
    - Faster, more reliable access to data across the business
    - Complete documentation, with knowledge shared across the team

- id: ai-offerings
  slug: ai-offerings
  name: AI Offerings
  summary: >-
    Applied AI built around a defined business problem, from initial
    scoping to production.
  icon: ai
  tone: bronze
  hero_heading: Applied AI, From Scoping to Production
  hero_body: >-
    We take AI initiatives from an initial idea to a working system,
    scoped rigorously, built responsibly, and measured against the
    outcomes that matter to your business.
  who_its_for: >-
    Teams with a specific challenge in mind, such as forecasting, process
    automation, search, document understanding, or a custom AI assistant,
    who value a partner that will also advise when AI is the wrong tool.
  offerings:
    - title: Use Case Scoping
      body: A rigorous assessment of whether AI is the right approach and how success will be measured.
    - title: Proof of Concept
      body: A focused build that validates feasibility before significant investment.
    - title: Production AI Systems
      body: Taking a validated concept to a reliable, monitored system your team can operate.
  approach:
    - title: Scope
      body: We define the problem and the success criteria before any code is written.
    - title: Prototype
      body: A working proof of concept, tested against your own data.
    - title: Productionise
      body: Hardening, monitoring, and handover so the system performs reliably over time.
  outcomes:
    - A working AI system tied to a measurable business outcome
    - Clarity on where AI creates value for your organisation, and where it does not
    - A system your team can monitor and maintain independently
