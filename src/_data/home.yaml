differentiators_heading: Why Lantera Digital
differentiators:
  - title: Built on Your Real Data
    body: Every engagement runs on your own data, systems, and tools, so the results hold up in production.
  - title: Designed for Handover
    body: Documentation and training are part of every delivery, so your team owns and operates what we build.
  - title: Candid Advice
    body: If a platform or an AI approach is the wrong fit for you, we say so before any budget is committed.
  - title: Regional Expertise
    body: We are based in Malaysia and understand the regulatory, talent, and business landscape of the region.

approach_heading: How We Work
approach:
  - title: Discover
    body: We start by understanding your objectives, your data, and the constraints you operate within.
  - title: Scope
    body: A clear plan with defined deliverables and a price that reflects what you need.
  - title: Build Together
    body: Your team works alongside ours throughout, with full visibility at every stage.
  - title: Hand Over
    body: Complete documentation and training keep everything running long after the engagement ends.
