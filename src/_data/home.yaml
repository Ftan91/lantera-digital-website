hero:
  heading: Turn Your Data Into Decisions You Can Trust
  subheading: >-
    We are a data and AI consultancy in Kuala Lumpur. We organise your
    business data so it is reliable and easy to use, train your team to
    work with it, and build AI tools that take on time consuming work.
  primary_cta:
    label: Explore Our Services
    url: /services/
  secondary_cta:
    label: Get in Touch
    url: /contact/

differentiators_heading: Why Work With Us
differentiators:
  - title: We Work With Your Data
    body: We use your actual systems and data from the start, so what we build is ready for everyday use.
  - title: Your Team Can Run It
    body: We document everything and train your staff, so you are not dependent on us once the work is done.
  - title: Honest Advice
    body: If a new platform or an AI project will not give you a good return, we will tell you before you spend money on it.
  - title: Local Knowledge
    body: We are based in Malaysia and understand the local market, regulations and talent pool.

approach_heading: How We Work
approach:
  - title: Understand
    body: We learn about your business, your goals and the data you already have.
  - title: Plan
    body: We agree on what will be delivered, when, and at what cost, before any work begins.
  - title: Build
    body: We do the work alongside your team and keep you updated at every step.
  - title: Hand Over
    body: We document everything and train your staff so they can look after it themselves.
